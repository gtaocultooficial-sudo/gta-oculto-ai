name: Cloud Production Trigger
# Manual production verification trigger

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  produce:
    if: contains(github.event.head_commit.message, '[produce]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment
        shell: bash
        run: |
          set -e
          echo "Esperando o Render executar exatamente o commit $GITHUB_SHA"
          for i in {1..36}; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" https://gta-oculto-ai.onrender.com/health || true)
            body=$(cat /tmp/health.json 2>/dev/null || true)
            deployed=$(echo "$body" | python -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            version=$(echo "$body" | python -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            echo "health=$code commit=$deployed version=$version attempt=$i"
            if [ "$code" = "200" ] && [ "$deployed" = "$GITHUB_SHA" ] && echo "$version" | grep -q 'V64.7'; then
              echo "Render ativo no commit esperado."
              exit 0
            fi
            sleep 10
          done
          echo "Render não ativou o commit esperado; produção bloqueada."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Start autonomous production
        shell: bash
        run: |
          set -e
          echo "Deployment candidate: $GITHUB_SHA"
          echo "Starting exactly one production for this run"
          response=$(curl -sS --max-time 30 https://gta-oculto-ai.onrender.com/api/produce)
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          job_id=$(echo "$response" | python -c "import json,sys; print(json.load(sys.stdin)['job_id'])")
          echo "JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: Wait for production and verify output
        shell: bash
        run: |
          set -e
          echo "Aguardando conclusão do job $JOB_ID..."
          for i in {1..24}; do
            body=$(curl -sS --max-time 30 "https://gta-oculto-ai.onrender.com/api/job/$JOB_ID" || true)
            if ! echo "$body" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('id') or d.get('job_id')" 2>/dev/null; then
              echo "Resposta de job ausente/inválida; não marcar como sucesso."
              echo "$body"
              exit 1
            fi
            echo "$body" > /tmp/job.json
            status=$(echo "$body" | python -c "import json,sys; print(json.load(sys.stdin).get('status','UNKNOWN'))" 2>/dev/null || echo UNKNOWN)
            stage=$(echo "$body" | python -c "import json,sys; print(json.load(sys.stdin).get('stage',''))" 2>/dev/null || true)
            progress=$(echo "$body" | python -c "import json,sys; print(json.load(sys.stdin).get('progress',''))" 2>/dev/null || true)
            echo "attempt=$i status=$status stage=$stage progress=$progress"
            if [ "$status" = "DONE" ]; then
              echo "===== PRODUÇÃO CONCLUÍDA: status não substitui QA editorial ====="
              python - <<'PY'
          import json
          d=json.load(open('/tmp/job.json'))
          print("job_id:", d.get("id"))
          print("status:", d.get("status"))
          print("stage:", d.get("stage"))
          print("progress:", d.get("progress"))
          print("score:", d.get("score"))
          print("video:", d.get("video"))
          print("cover:", d.get("cover"))
          print("metadata:", d.get("metadata",{}))
          PY
              exit 0
            fi
            if [ "$status" = "ERROR" ]; then
              echo "===== PRODUÇÃO FALHOU ====="
              cat /tmp/job.json
              exit 1
            fi
            sleep 10
          done
          echo "===== TIMEOUT DE PRODUÇÃO ====="
          cat /tmp/job.json
          exit 1
