name: Cloud Production Trigger
# Production verification + controlled UI redesign automation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: contains(github.event.head_commit.message, '[redesign]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply V61 futuristic dashboard skin
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("app.py")
          s = p.read_text(encoding="utf-8")

          css = r'''
<style id="futuristic-v61">
:root{
 --bg:#05070b;--panel:#0a0f16;--panel2:#0e1520;--line:#182433;
 --text:#eef4ff;--muted:#718096;--purple:#9b5cff;--cyan:#36d8ff;
 --green:#35e6a1;--yellow:#f4c95d;--red:#ff4961
}
html{background:#05070b}
body{
 background:
 radial-gradient(900px 500px at 15% -10%,rgba(133,70,255,.16),transparent 60%),
 radial-gradient(800px 500px at 95% 0%,rgba(40,205,255,.09),transparent 58%),
 linear-gradient(180deg,#05070b,#070a0f 55%,#05070b);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 letter-spacing:.01em
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
 background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
 background-size:44px 44px;
 mask-image:linear-gradient(to bottom,black,transparent 78%)
}
.wrap{max-width:1240px;padding:14px}
.top{margin-bottom:9px;height:38px}
.brand{font-size:18px;letter-spacing:-.7px}
.status{padding:6px 10px;font-size:9px;backdrop-filter:blur(12px)}
.hero{
 min-height:108px;padding:15px 17px;border-radius:14px;
 background:linear-gradient(135deg,rgba(16,22,34,.92),rgba(8,12,18,.9));
 border:1px solid #1b2a3d;box-shadow:0 18px 55px rgba(0,0,0,.22)
}
.hero h1{font-size:21px;margin:5px 0}
.eyebrow{font-size:8px;letter-spacing:1.8px;color:#ae7aff}
.muted{font-size:10px;color:#758397}
.buttons{gap:6px}
.btn{padding:8px 11px;border-radius:8px;font-size:10px}
.control{
 margin-top:7px;padding:7px;background:rgba(7,11,17,.82);
 border:1px solid #182638;border-radius:10px
}
.control input{padding:9px 11px;border-radius:7px;font-size:11px}
.stats{gap:7px;margin:8px 0}
.stat{
 padding:10px 12px;border-radius:10px;
 background:linear-gradient(145deg,rgba(13,20,30,.94),rgba(8,13,20,.94));
 border:1px solid #172638;box-shadow:none
}
.stat small{font-size:8px;letter-spacing:1px}
.stat b{font-size:21px;margin-top:2px}
.panel{
 margin:8px 0;padding:11px 12px;border-radius:11px;
 background:rgba(8,13,20,.76);border:1px solid #172638;
 box-shadow:0 10px 28px rgba(0,0,0,.12);backdrop-filter:blur(12px)
}
.panel h3{font-size:10px;margin-bottom:8px;letter-spacing:1px}
.notice{padding:8px 10px;border-radius:8px;font-size:9px}
.steps{gap:4px}
.step{padding:7px 3px;border-radius:6px;font-size:8px}
.editor-shell{
 padding:12px;border-radius:12px;
 background:linear-gradient(135deg,rgba(24,18,42,.9),rgba(7,13,21,.96));
 border:1px solid #5c39a7;box-shadow:0 0 40px rgba(119,57,255,.07)
}
.editor-head{margin-bottom:9px}
.editor-icon{width:31px;height:31px;border-radius:9px;font-size:16px}
.editor-head h2{font-size:15px}
.editor-head p{font-size:9px}
.editor-status{padding:7px 9px;font-size:8px}
.editor-grid-main{grid-template-columns:110px minmax(0,1fr) 125px;gap:10px}
.editor-cover{min-height:135px;border-radius:9px;padding:9px}
.editor-cover-icon{font-size:38px}
.editor-cover:before{font-size:40px}
.editor-title{font-size:17px;margin:6px 0 8px}
.editor-metrics{gap:5px}
.editor-metric{padding:6px;border-radius:7px}
.editor-metric small{font-size:7px}
.editor-metric b{font-size:12px}
.editor-copy{gap:6px;margin-top:6px}
.editor-hook,.editor-angle{min-height:54px;padding:7px;border-radius:8px}
.editor-hook b,.editor-angle b{font-size:8px;margin-bottom:3px}
.editor-copy span{font-size:9px}
.editor-decision{min-height:135px;border-radius:9px;padding:9px}
.decision-check{font-size:24px}
.decision-word{font-size:14px;margin:5px 0}
.decision-reason{font-size:8px}
.editor-produce{margin-top:7px;padding:8px;font-size:9px}
.script-preview{margin-top:6px;padding:7px;border-radius:8px}
.script-head{margin-bottom:5px}
.script-head b{font-size:8px}
.script-head span{font-size:7px}
.script-stats{font-size:7px;padding:4px 6px}
.script-flow{gap:4px}
.script-flow>div{padding:6px;border-radius:6px}
.script-flow small{font-size:6px;margin-bottom:3px}
.script-flow span{font-size:7px}
.radar-head{margin-bottom:7px}
.filters{gap:4px}
.filter{padding:5px 7px;font-size:8px;border-radius:6px}
.table-head,.row{grid-template-columns:28px 48px minmax(220px,1fr) 66px 58px 82px 62px 68px;gap:6px}
.table-head{padding:6px 7px;font-size:7px}
.row{padding:7px;border-bottom:1px solid #14202e}
.rank{font-size:8px}
.scorebox{width:34px;height:28px;border-radius:7px;font-size:13px}
.title{font-size:9px}
.source{font-size:7px;margin-top:2px}
.tags{gap:3px;margin-top:3px}
.tag{font-size:6px;padding:2px 4px}
.type{padding:4px 5px;font-size:6px}
.conf{font-size:8px}
.relevance{padding:4px;font-size:6px}
.produce{padding:6px 5px;font-size:7px;border-radius:6px}
.job{padding:8px;border-radius:8px;margin-top:6px}
.jobhead{font-size:9px}
.log{font-size:8px}
.meta{font-size:8px}
.result{gap:7px;margin-top:7px}
.result a{font-size:9px}
#liveClipperPanel{border-color:#214f85!important}
#liveClipperPanel .control{display:grid;grid-template-columns:minmax(0,1fr) 65px auto}
#liveClipperPanel .control input{min-width:0}
@media(max-width:1050px){
 .editor-grid-main{grid-template-columns:100px minmax(0,1fr)}
 .editor-decision{grid-column:1/-1;min-height:80px;flex-direction:row;gap:10px}
 .editor-produce{width:auto;min-width:180px}
}
@media(max-width:700px){
 .wrap{padding:9px}
 .top{height:32px}
 .brand{font-size:16px}
 .status{font-size:8px}
 .hero{padding:12px;min-height:0}
 .hero h1{font-size:17px}
 .buttons{margin-top:8px}
 .stats{gap:5px}
 .stat{padding:8px}
 .stat b{font-size:18px}
 .panel{padding:9px;margin:6px 0}
 .editor-grid-main{grid-template-columns:1fr}
 .editor-cover{min-height:78px}
 .editor-decision{grid-column:auto;min-height:0;display:flex;flex-direction:column}
 .editor-produce{width:100%;min-width:0}
 #liveClipperPanel .control{grid-template-columns:1fr}
 .table-head{display:none!important}
 .row{grid-template-columns:34px 1fr!important;padding:8px!important}
 .row>*{grid-column:2!important}
 .row .rank{grid-column:1!important;grid-row:1 / span 5}
 .row .scorebox{grid-column:1!important;grid-row:1!important}
 .row .type,.row .conf,.row .relevance{display:none}
}
</style>
'''
          # Replace previous V61 block if it exists, otherwise inject before mobile CSS.
          s = re.sub(r'<style id="futuristic-v61">.*?</style>\s*', '', s, flags=re.S)
          marker = '<style id="mobile-access-v60">'
          if marker not in s:
              raise SystemExit("mobile CSS marker not found")
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit redesigned panel
        shell: bash
        run: |
          set -e
          git config user.name "GTA OCULTO AI"
          git config user.email "gtaocultooficial@gmail.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "V61: futuristic clean dashboard"
          git push

  produce:
    if: contains(github.event.head_commit.message, '[produce]')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment
        shell: bash
        run: |
          set -e
          sleep 120
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://gta-oculto-ai.onrender.com/health || true)
            echo "health=$code attempt=$i"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Start autonomous production
        shell: bash
        run: |
          set -e
          response=$(curl -sS --max-time 30 https://gta-oculto-ai.onrender.com/api/produce)
          echo "$response"
          echo "$response" | grep -q '"ok":true'
